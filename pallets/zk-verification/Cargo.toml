[package]
name = "pallet-zk-verification"
version = "1.0.0"
authors = ["AFE Protocol Team"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/Geserkhan/HTS_Global_Intelligence_Base"
repository = "https://github.com/Geserkhan/HTS_Global_Intelligence_Base"
description = "Zero-Knowledge Proof Verification Pallet for AFE Protocol"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.1", default-features = false, features = ["derive"] }
scale-info = { version = "2.5.0", default-features = false, features = ["derive"] }

# Substrate dependencies
frame-benchmarking = { version = "4.0.0-dev", default-features = false, optional = true }
frame-support = { version = "4.0.0-dev", default-features = false }
frame-system = { version = "4.0.0-dev", default-features = false }
sp-runtime = { version = "24.0.0", default-features = false }
sp-std = { version = "8.0.0", default-features = false }

[dev-dependencies]
sp-core = { version = "21.0.0" }
sp-io = { version = "23.0.0" }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-runtime/std",
    "sp-std/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
